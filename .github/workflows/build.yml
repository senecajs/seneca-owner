name: build

# This repo's default branch is `master`. The filters below listed only
# `main`, so NO pull request ever ran this workflow and no push to master
# did either — the suite has been effectively off. The only check landing
# on a PR was the TODO workflow, which triggers on any push and is
# currently failing repo-wide on an unrelated action bug, so the repo
# looked like it had CI while running no tests at all.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    timeout-minutes: 6

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x, 22.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
