# Publish @seneca/owner to npm when a version tag is pushed.
#
# DORMANT. GitHub only runs workflows under .github/workflows/, and this
# repo's active workflows are build.yml and todo.yml. Activating this
# needs an NPM_TOKEN repository secret - see ci/README.md.
#
# This exists because the local publish path (`npm run repo-publish`)
# requires the `aql` vault CLI and a logged-in npm session. Publishing
# from CI needs neither on any individual machine: the token lives in the
# repository's secrets, and a tag is the trigger.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify only - do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: install
        run: npm install --no-audit --no-fund

      - name: build
        run: npm run build

      - name: test
        run: npm test

      # The tag and package.json must agree, or you publish a version
      # nobody can find from the git history. This repo has been bitten by
      # the adjacent problem: main once carried the whole rolesys feature
      # under 6.2.0, the version ALREADY on npm, so `npm i @seneca/owner`
      # returned a build without it while every source reference implied
      # otherwise. Bump before tagging.
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Refuse to republish a version that already exists, rather than
      # failing halfway through with a 403 from the registry.
      - name: version is not already published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already published - bump the version"
            exit 1
          fi

      - name: publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --dry-run

      # A PRERELEASE tag (v1.2.3-rc1) must publish under its own dist-tag.
      # Without --tag npm uses `latest`, which would point every plain
      # `npm i` at an unstable build; npm 11 refuses outright. The tag
      # trigger accepts prereleases, so this has to be derived, not assumed.
      - name: derive dist-tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=${GITHUB_REF_NAME#v}
          case "$VER" in
            *-*) echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
          echo "publishing $VER under dist-tag ${NPM_DIST_TAG:-(see above)}"

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
